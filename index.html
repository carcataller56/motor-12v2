<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Invernadero - Remoto</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #3498db; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 15px; text-align: center; }
    .card { max-width: 400px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); border: 1px solid #2a2a2a; }
    h2 { margin: 0 0 20px 0; font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 10px; }
    
    /* Badge de Conexión */
    .badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; transition: 0.3s; }
    .offline { background: #4a1515; color: #ff7b7b; border: 1px solid #ff4d4d; }
    .online { background: #154a22; color: #75f08a; border: 1px solid #2ecc71; }

    /* Inputs y Controles */
    .control-group { background: #252525; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
    .control-group label { font-weight: bold; color: #aaa; }
    input[type="number"] { width: 70px; padding: 10px; font-size: 20px; text-align: center; border-radius: 8px; border: 1px solid #444; background: #121212; color: var(--accent); font-weight: bold; }
    
    input[type="password"] { width: 100%; padding: 12px; font-size: 22px; text-align: center; border-radius: 8px; border: 1px solid #555; background: #121212; color: #fff; letter-spacing: 8px; margin-bottom: 15px; box-sizing: border-box; }
    
    /* Botones */
    .btn { width: 100%; padding: 18px; margin: 6px 0; font-size: 16px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; color: #fff; transition: 0.2s; }
    .btn-subir { background: linear-gradient(135deg, #2980b9, #1f618d); }
    .btn-bajar { background: linear-gradient(135deg, #d35400, #a04000); }
    .btn-stop { background: linear-gradient(135deg, #c0392b, #922b21); margin-top: 15px; border: 2px solid #e74c3c; }
    .btn:active:not(:disabled) { transform: scale(0.98); opacity: 0.8; }
    .btn:disabled { background: #333; color: #666; border-color: #333; cursor: not-allowed; }

    /* Panel de Estado / Logs */
    .log-panel { margin-top: 25px; padding: 15px; background: #0a0a0a; border-radius: 8px; font-size: 14px; text-align: left; border-left: 4px solid var(--accent); }
    .log-title { color: #888; margin-bottom: 8px; font-size: 12px; text-transform: uppercase; }
    .log-val { color: #00ff00; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌍 Control Remoto</h2>
    
    <div id="badgeEsp" class="badge offline">Buscando Invernadero...</div>

    <div class="control-group">
      <label>⏱️ Tiempo:</label>
      <div>
        <input type="number" id="mins" min="1" max="15" value="1">
        <span style="color:#aaa; margin-left:5px;">min.</span>
      </div>
    </div>

    <div style="text-align: left; margin-bottom: 5px; color: #aaa; font-size: 13px; font-weight: bold;">PIN de Seguridad:</div>
    <input type="password" id="pinInput" maxlength="4" placeholder="••••">

    <button id="btnSubir" class="btn btn-subir" onclick="intentarDisparo('SUBIR')" disabled>▲ SUBIR CORTINA</button>
    <button id="btnBajar" class="btn btn-bajar" onclick="intentarDisparo('BAJAR')" disabled>▼ BAJAR CORTINA</button>
    
    <!-- El STOP no requiere PIN por si hay una emergencia -->
    <button id="btnStop" class="btn btn-stop" onclick="enviarParada()" disabled>🛑 PARADA INMEDIATA</button>

    <div class="log-panel">
      <div class="log-title">Última respuesta del motor:</div>
      <div id="logEstado" class="log-val">Esperando conexión...</div>
    </div>
  </div>

  <script>
    // Configuración
    const PIN_CORRECTO = "1234"; // ¡Podés cambiarlo por el que quieras!
    const TOPIC_CMD    = "casa/cortina/comando";
    const TOPIC_STATUS = "casa/cortina/status";
    const TOPIC_ACK    = "casa/cortina/ack";

    // Conexión segura por WebSockets
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    const badgeEsp  = document.getElementById('badgeEsp');
    const btnSubir  = document.getElementById('btnSubir');
    const btnBajar  = document.getElementById('btnBajar');
    const btnStop   = document.getElementById('btnStop');
    const logEstado = document.getElementById('logEstado');
    let espConectado = false;

    client.on('connect', () => {
      client.subscribe(TOPIC_STATUS);
      client.subscribe(TOPIC_ACK);
      logEstado.innerText = "Conectado al servidor. Esperando placa...";
    });

    client.on('message', (topic, message) => {
      const msg = message.toString();

      if (topic === TOPIC_STATUS) {
        if (msg === "ONLINE") {
          espConectado = true;
          badgeEsp.className = "badge online";
          badgeEsp.innerText = "INVERNADERO EN LÍNEA";
          btnSubir.disabled = false;
          btnBajar.disabled = false;
          btnStop.disabled = false;
          logEstado.innerText = "Sistema listo para operar.";
        } else {
          espConectado = false;
          badgeEsp.className = "badge offline";
          badgeEsp.innerText = "INVERNADERO DESCONECTADO";
          btnSubir.disabled = true;
          btnBajar.disabled = true;
          btnStop.disabled = true;
          logEstado.innerText = "La placa perdió conexión a Internet.";
        }
      }

      if (topic === TOPIC_ACK) {
        const ahora = new Date().toLocaleTimeString();
        logEstado.innerText = `[${ahora}] ${msg}`;
        // Volvemos a habilitar botones si terminó el movimiento
        if (espConectado) {
          btnSubir.disabled = false;
          btnBajar.disabled = false;
        }
      }
    });

    function enviarParada() {
      // El STOP no valida PIN por seguridad. Frena todo al instante.
      client.publish(TOPIC_CMD, "STOP");
      logEstado.innerText = "Enviando señal de parada...";
      btnSubir.disabled = false;
      btnBajar.disabled = false;
    }

    function intentarDisparo(direccion) {
      const pin = document.getElementById('pinInput').value;
      if (pin !== PIN_CORRECTO) {
        alert("PIN de seguridad incorrecto.");
        document.getElementById('pinInput').value = "";
        return;
      }

      const minutos = parseInt(document.getElementById('mins').value);
      if (minutos <= 0 || isNaN(minutos)) return;
      
      const segundosTotales = minutos * 60;

      // Deshabilitamos botones temporalmente para no mandar doble orden
      btnSubir.disabled = true;
      btnBajar.disabled = true;

      // Enviamos el comando en formato DIRECCION:SEGUNDOS (Ej: "SUBIR:120")
      client.publish(TOPIC_CMD, `${direccion}:${segundosTotales}`);
      
      logEstado.innerText = `Enviando orden: ${direccion} por ${minutos} min...`;
      document.getElementById('pinInput').value = ""; // Limpiamos el PIN
    }
  </script>
</body>
</html>
