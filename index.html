<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h2 {
            margin-bottom: 40px;
            font-size: 28px;
            color: #aaaaaa;
        }
        button { 
            display: block; 
            width: 85%; 
            max-width: 350px; 
            margin: 15px auto; 
            padding: 20px 20px; 
            font-size: 18px; 
            font-weight: bold; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease 0s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 5px rgba(0,0,0,0.5);
        }
        .btn-subir { 
            background-color: #00b894; 
            color: white; 
        }
        .btn-bajar { 
            background-color: #0984e3; 
            color: white; 
        }
    </style>
</head>
<body>

    <h2>Control de Cortina</h2>
    
    <button class="btn-subir" onclick="alert('Comando enviado con éxito.')">hacerle la vida mas facil a duam</button>
    
    <button class="btn-bajar" onclick="alert('Comando enviado con éxito.')">demostrar que el capitalismo mejora al mundo</button>

</body>
</html>
